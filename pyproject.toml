[project]
name = "neural-audio-bakeoff"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.50",
  "qwen-tts",
  "soundfile",
  "librosa",
  "numpy",
  "faster-whisper",
  "jiwer",
  "whisper-normalizer",
  "scipy",
  "pesq>=0.0.4",
  "fastapi>=0.162.0",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
  "onnx-asr[cpu,hub]>=0.12.0",
  "sherpa-onnx>=2.0.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
